<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Daftar Hadir | IBITEK</title>
<meta name="theme-color" content="#e4f000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Admin Hadir">
<!-- Penghubung manifest dan ikon untuk layar utama HP -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --lime:#e4f000; --ink:#1a1c12; --muted:#6b6f5c; --line:#e3e5d6; --bg:#f6f7ee; --card:#fff;
  --leaf:#2f7d32; --rust:#b3401f; --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--lime);padding:env(safe-area-inset-top,0) 0 0}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff}
.top h1{margin:0;font-size:18px;line-height:1.2}
.top p{margin:2px 0 0;font-size:13px;opacity:.75}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:17px}
.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
.bar{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--ink);outline-offset:1px}
.share{display:flex;gap:8px}
.share input{flex:1;min-width:0;background:var(--bg)}
.btn{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:var(--ink);color:#fff;cursor:pointer}
.btn:active{opacity:.8}
.btn.full{width:100%;margin-top:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.danger{color:var(--rust)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Daftar pertemuan */
.mk{padding:12px 0;border-top:1px solid var(--line)}
.mk:first-child{border-top:0;padding-top:0}
.mk b{display:block;font-size:16px;overflow-wrap:anywhere}
.mk small{color:var(--muted);font-size:13px}
.mk .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.buka{background:#e3f4e3;color:var(--leaf)}
.badge.tutup{background:#f1ecea;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .btn{padding:10px 8px;font-size:14px}
.acts [data-a="rekap"]{grid-column:1/-1;background:var(--lime);border-color:var(--lime)}
.empty{color:var(--muted);text-align:center;margin:12px 0}

/* Rekap */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-weight:700;font-size:15px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
.r .nm{font-weight:600;overflow-wrap:anywhere}
.r .sub{grid-column:1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.r .x{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:8px}
.r .x .btn{padding:6px 10px;min-height:36px;font-size:13px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag.Hadir{background:#e3f4e3;color:var(--leaf)}
.tag.Izin{background:#fbe9e2;color:var(--rust)}

@media(min-width:560px){
  .bar{flex-direction:row;align-items:center;justify-content:space-between}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img src="logo.png" alt="Logo IBITEK">
  <div><h1>Admin Daftar Hadir</h1><p>Atur mata kuliah, tanggal, dan rekap kehadiran</p></div>
</div></header>

<main>
  <div id="app">
    <section class="card">
      <h2>Link untuk mahasiswa</h2>
      <p class="hint">Bagikan link ini ke grup kelas.</p>
      <div class="share"><input id="link" readonly aria-label="Link mahasiswa"><button class="btn" id="salin">Salin</button></div>
    </section>

    <section class="card">
      <h2>Tambah mata kuliah</h2>
      <form id="mf">
        <div class="row">
          <div><label for="mn">Nama mata kuliah</label><input id="mn" maxlength="80" placeholder="Sistem Informasi" required></div>
          <div><label for="mt">Tanggal</label><input id="mt" type="date" required></div>
        </div>
        <button class="btn full" type="submit">Simpan dan buka absensi</button>
      </form>
    </section>

    <section class="card">
      <h2>Daftar pertemuan</h2>
      <p class="hint">Tutup absensi agar mahasiswa tidak bisa mengisi lagi.</p>
      <div id="list"><p class="empty">Memuat…</p></div>
    </section>

    <section class="card" id="rekap" hidden>
      <div class="bar"><h2 id="rt"></h2></div>
      <div class="stat" id="rs"></div>
      <div class="dl">
        <button class="btn lime" id="gbr">Unduh gambar</button>
        <button class="btn ghost" id="csv">Unduh CSV</button>
      </div>
      <div class="rows" id="rb" style="margin-top:8px"></div>
    </section>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// GANTI dengan alamat web mahasiswa kamu (repo yang satunya)
const LINK_MAHASISWA = 'https://ibitek-bjm.github.io/daftarhadir/';
let M = {}, ref = null, aktif = null, rows = [], started = false;

function init() {
  $('#link').value = LINK_MAHASISWA;
  $('#mt').valueAsDate = new Date();
  db.ref('matkul').on('value', s => { M = s.val() || {}; renderList(); });
}

$('#salin').onclick = () => { navigator.clipboard.writeText($('#link').value); $('#salin').textContent = 'Tersalin'; setTimeout(() => $('#salin').textContent = 'Salin', 1500); };

$('#mf').addEventListener('submit', e => {
  e.preventDefault();
  db.ref('matkul').push({ nama: $('#mn').value.trim(), tanggal: $('#mt').value, status: 'buka', dibuat: firebase.database.ServerValue.TIMESTAMP })
    .then(() => { $('#mn').value = ''; });
});

function renderList() {
  const items = Object.entries(M).sort((a, b) => b[1].tanggal.localeCompare(a[1].tanggal));
  $('#list').innerHTML = items.length ? items.map(([id, m]) => `
    <div class="mk">
      <b>${esc(m.nama)}</b>
      <div class="meta"><span class="badge ${m.status}">${m.status === 'buka' ? 'Dibuka' : 'Ditutup'}</span>
        <small>${esc(fmtTanggal(m.tanggal))}</small></div>
      <div class="acts" data-id="${esc(id)}">
        <button class="btn" data-a="rekap">Lihat rekap</button>
        <button class="btn ghost" data-a="toggle">${m.status === 'buka' ? 'Tutup absensi' : 'Buka lagi'}</button>
        <button class="btn ghost danger" data-a="hapus">Hapus</button>
      </div>
    </div>`).join('') : '<p class="empty">Belum ada mata kuliah. Tambahkan lewat formulir di atas.</p>';
  if (aktif && !M[aktif]) { tutupRekap(); }
}

$('#list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.parentElement.dataset.id, a = b.dataset.a;
  if (a === 'rekap') bukaRekap(id);
  if (a === 'toggle') db.ref(`matkul/${id}/status`).set(M[id].status === 'buka' ? 'tutup' : 'buka');
  if (a === 'hapus' && confirm(`Hapus "${M[id].nama}" beserta seluruh data kehadirannya?`)) {
    db.ref(`absensi/${id}`).remove().then(() => db.ref(`matkul/${id}`).remove());
  }
});

const fmtWaktu = (w, opt) => w ? new Date(w).toLocaleString('id-ID', opt || {dateStyle:'short', timeStyle:'short'}) : '';

function bukaRekap(id) {
  if (ref) ref.off();
  aktif = id; ref = db.ref(`absensi/${id}`);
  $('#rekap').hidden = false;
  $('#rt').textContent = `${M[id].nama} · ${fmtTanggal(M[id].tanggal)}`;
  ref.on('value', s => {
    rows = Object.values(s.val() || {}).sort((a, b) => a.nama.localeCompare(b.nama));
    const h = rows.filter(r => r.status === 'Hadir').length;
    $('#rs').innerHTML = `<div>Total ${rows.length}</div><div style="color:var(--leaf)">Hadir ${h}</div><div style="color:var(--rust)">Izin ${rows.length - h}</div>`;
    $('#rb').innerHTML = rows.length ? rows.map(r => `
      <div class="r">
        <div class="nm">${esc(r.nama)}</div>
        <div class="x"><span class="tag ${esc(r.status)}">${esc(r.status)}</span><button class="btn ghost danger" data-npm="${esc(r.npm)}" aria-label="Hapus ${esc(r.nama)}">Hapus</button></div>
        <div class="sub">${esc(r.npm)}${r.waktu ? ' · ' + esc(fmtWaktu(r.waktu)) : ''}</div>
      </div>`).join('')
      : '<p class="empty">Belum ada yang mengisi.</p>';
  });
  $('#rekap').scrollIntoView({ behavior: 'smooth' });
}
function tutupRekap() { if (ref) ref.off(); ref = null; aktif = null; $('#rekap').hidden = true; }

$('#rb').addEventListener('click', e => {
  const b = e.target.closest('button[data-npm]');
  if (b && confirm('Hapus data kehadiran ini?')) db.ref(`absensi/${aktif}/${b.dataset.npm}`).remove();
});

$('#csv').onclick = () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const out = ['Nama,NPM,Keterangan,Waktu', ...rows.map(r => [r.nama, r.npm, r.status, r.waktu ? new Date(r.waktu).toLocaleString('id-ID') : ''].map(q).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + out], { type: 'text/csv' }));
  a.download = `kehadiran-${M[aktif].nama}-${M[aktif].tanggal}.csv`.replace(/\s+/g, '-');
  a.click();
};

// Unduh rekap sebagai gambar PNG (semua nama ditampilkan penuh, nama panjang dibungkus)
$('#gbr').onclick = () => {
  if (!aktif || !rows.length) { alert('Belum ada data kehadiran untuk dijadikan gambar.'); return; }
  const m = M[aktif], W = 900, P = 32, S = 2, F = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  const cols = [
    { x: P,       w: 44 },                 // No
    { x: P + 44,  w: 320 },                // Nama
    { x: P + 364, w: 150 },                // NPM
    { x: P + 514, w: 90 },                 // Keterangan
    { x: P + 604, w: W - 2 * P - 604 }     // Waktu
  ];
  const mc = document.createElement('canvas').getContext('2d');
  mc.font = `16px ${F}`;
  const wrap = (txt, maxW) => {
    const lines = []; let cur = '';
    for (const word of String(txt).split(/\s+/)) {
      let w = word;
      while (mc.measureText(w).width > maxW) {   // pecah kata yang terlalu panjang
        let i = w.length; while (i > 1 && mc.measureText(w.slice(0, i)).width > maxW) i--;
        if (cur) { lines.push(cur); cur = ''; }
        lines.push(w.slice(0, i)); w = w.slice(i);
      }
      const t = cur ? cur + ' ' + w : w;
      if (cur && mc.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  };
  const LH = 22, PAD = 12;
  const data = rows.map((r, i) => {
    const nama = wrap(r.nama, cols[1].w - 12);
    const waktu = wrap(fmtWaktu(r.waktu), cols[4].w);
    const n = Math.max(nama.length, waktu.length, 1);
    return { r, i, nama, waktu, h: n * LH + PAD * 2 };
  });
  const hadir = rows.filter(r => r.status === 'Hadir').length;
  const headH = 112, thH = 40, footH = 48;
  const H = P + headH + thH + data.reduce((s, d) => s + d.h, 0) + footH;

  const c = document.createElement('canvas');
  c.width = W * S; c.height = H * S;
  const g = c.getContext('2d'); g.scale(S, S); g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#e4f000'; g.fillRect(0, 0, W, 10);

  g.fillStyle = '#1a1c12'; g.font = `700 26px ${F}`;
  g.fillText(m.nama, P, P + 22, W - 2 * P);
  g.fillStyle = '#6b6f5c'; g.font = `16px ${F}`;
  g.fillText(`Daftar hadir · ${fmtTanggal(m.tanggal)}`, P, P + 54);
  g.font = `700 16px ${F}`;
  let sx = P; const sy = P + 88;
  [[`Total ${rows.length}`, '#1a1c12'], [`Hadir ${hadir}`, '#2f7d32'], [`Izin ${rows.length - hadir}`, '#b3401f']].forEach(([t, col]) => {
    g.fillStyle = col; g.fillText(t, sx, sy); sx += g.measureText(t).width + 28;
  });

  let y = P + headH;
  g.fillStyle = '#e4f000'; g.fillRect(P, y, W - 2 * P, thH);
  g.fillStyle = '#1a1c12'; g.font = `700 15px ${F}`;
  ['No', 'Nama', 'NPM', 'Keterangan', 'Waktu'].forEach((t, k) => g.fillText(t, cols[k].x + (k ? 0 : 6), y + thH / 2));
  y += thH;

  data.forEach(d => {
    if (d.i % 2) { g.fillStyle = '#f6f7ee'; g.fillRect(P, y, W - 2 * P, d.h); }
    g.strokeStyle = '#e3e5d6'; g.beginPath(); g.moveTo(P, y + d.h); g.lineTo(W - P, y + d.h); g.stroke();
    const mid = y + d.h / 2;
    g.font = `16px ${F}`; g.fillStyle = '#1a1c12';
    g.fillText(String(d.i + 1), cols[0].x + 6, mid);
    const top = mid - (d.nama.length * LH) / 2 + LH / 2;
    d.nama.forEach((t, k) => g.fillText(t, cols[1].x, top + k * LH));
    g.fillText(String(d.r.npm), cols[2].x, mid, cols[2].w - 8);
    g.font = `700 16px ${F}`; g.fillStyle = d.r.status === 'Hadir' ? '#2f7d32' : '#b3401f';
    g.fillText(d.r.status, cols[3].x, mid);
    g.font = `15px ${F}`; g.fillStyle = '#6b6f5c';
    const wt = mid - (d.waktu.length * LH) / 2 + LH / 2;
    d.waktu.forEach((t, k) => g.fillText(t, cols[4].x, wt + k * LH));
    y += d.h;
  });

  g.font = `13px ${F}`; g.fillStyle = '#6b6f5c';
  g.fillText(`Dibuat ${new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })} · Admin Daftar Hadir IBITEK`, P, y + 26);

  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `kehadiran-${m.nama}-${m.tanggal}.png`.replace(/\s+/g, '-');
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
};
init();
</script>
</body>
</html>
